<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Diagram">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" class="arrowHead"/>
    </marker>
  </defs>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primarySoft: #dbeafe;
      --success: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --primary: #60a5fa;
        --primarySoft: #0b2a55;
        --success: #22c55e;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--surface); stroke: var(--border); stroke-width: 1.25; rx: 16; filter: url(#shadow); }
    .box { fill: white; fill: var(--bg); stroke: var(--border); stroke-width: 1.25; rx: 14; }
    .chip { fill: var(--primarySoft); stroke: var(--border); stroke-width: 1; rx: 10; }
    .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .h { font: 700 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .t { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--muted); }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; fill: var(--text); }
    .link { font: 600 13px ui-sans-serif, system-ui; fill: var(--primary); }
    .stroke { stroke: var(--border); stroke-width: 1.25; }
    .arrow { stroke: var(--primary); stroke-width: 2.25; fill: none; marker-end: url(#arrow); }
    .arrowMuted { stroke: var(--border); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrowHead { fill: var(--primary); }
    .badge { fill: var(--primary); }
    .badgeText { font: 700 12px ui-sans-serif, system-ui; fill: white; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="420"/>
  <text class="title" x="56" y="62">Plan → Confirm → Apply</text>
  <text class="t" x="56" y="88">A safe, reviewable loop for AI-assisted changes</text>

  <rect class="panel" x="40" y="110" width="1120" height="270" />

  <!-- Boxes -->
  <rect class="box" x="120" y="185" width="240" height="86" />
  <text class="h" x="200" y="220">Plan</text>
  <text class="t" x="152" y="244">Explain approach</text>

  <rect class="box" x="480" y="185" width="240" height="86" />
  <text class="h" x="544" y="220">Confirm</text>
  <text class="t" x="508" y="244">Human approval</text>

  <rect class="box" x="840" y="185" width="240" height="86" />
  <text class="h" x="918" y="220">Apply</text>
  <text class="t" x="888" y="244">Edit files</text>

  <!-- Arrows -->
  <path class="arrow" d="M360 228 L480 228" />
  <path class="arrow" d="M720 228 L840 228" />

  <!-- Review loop -->
  <path class="arrowMuted" d="M960 271 C960 330, 240 330, 240 271" />
  <text class="t" x="520" y="338">Review (git diff) → feedback → iterate</text>

  <!-- small notes -->
  <text class="t" x="120" y="310">Keep diffs small • Restart sessions when context is low</text>

  <circle class="badge" cx="1120" cy="150" r="14"/>
  <text class="badgeText" x="1115" y="154">2</text>
</svg>
