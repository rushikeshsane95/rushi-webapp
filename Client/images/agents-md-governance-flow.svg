<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Diagram">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" class="arrowHead"/>
    </marker>
  </defs>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primarySoft: #dbeafe;
      --success: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --primary: #60a5fa;
        --primarySoft: #0b2a55;
        --success: #22c55e;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--surface); stroke: var(--border); stroke-width: 1.25; rx: 16; filter: url(#shadow); }
    .box { fill: white; fill: var(--bg); stroke: var(--border); stroke-width: 1.25; rx: 14; }
    .chip { fill: var(--primarySoft); stroke: var(--border); stroke-width: 1; rx: 10; }
    .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .h { font: 700 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .t { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--muted); }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; fill: var(--text); }
    .link { font: 600 13px ui-sans-serif, system-ui; fill: var(--primary); }
    .stroke { stroke: var(--border); stroke-width: 1.25; }
    .arrow { stroke: var(--primary); stroke-width: 2.25; fill: none; marker-end: url(#arrow); }
    .arrowMuted { stroke: var(--border); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrowHead { fill: var(--primary); }
    .badge { fill: var(--primary); }
    .badgeText { font: 700 12px ui-sans-serif, system-ui; fill: white; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>
  <text class="title" x="56" y="62">agents.md governance flow</text>
  <text class="t" x="56" y="88">How prompts + repository rules turn Codex into a disciplined collaborator</text>

  <rect class="panel" x="40" y="110" width="1120" height="370" />

  <!-- Left column -->
  <rect class="box" x="90" y="170" width="240" height="86" />
  <text class="h" x="130" y="206">Developer prompt</text>
  <text class="t" x="130" y="230">Task + constraints</text>

  <path class="arrow" d="M330 213 L410 213" />

  <!-- Middle column: agents.md -->
  <rect class="box" x="420" y="156" width="300" height="114" />
  <text class="h" x="456" y="196">agents.md</text>
  <rect class="chip" x="456" y="208" width="118" height="26"/>
  <text class="mono" x="470" y="227">Do NOT</text>
  <rect class="chip" x="582" y="208" width="118" height="26"/>
  <text class="mono" x="596" y="227">Scope</text>
  <rect class="chip" x="456" y="240" width="244" height="26"/>
  <text class="mono" x="470" y="259">Plan → Confirm → Apply</text>

  <path class="arrow" d="M720 213 L800 213" />

  <!-- Right column: Codex Agent -->
  <rect class="box" x="810" y="156" width="300" height="114" />
  <text class="h" x="846" y="196">Codex agent</text>
  <text class="t" x="846" y="222">Reads repo + follows rules</text>
  <text class="t" x="846" y="246">Generates plan & changes</text>

  <!-- Down to workflow -->
  <path class="arrow" d="M960 270 L960 312" />

  <rect class="box" x="680" y="320" width="560" height="96" />
  <text class="h" x="720" y="356">Workflow checkpoint</text>
  <text class="t" x="720" y="380">Plan → Confirm → Apply → Review</text>

  <!-- Git review -->
  <path class="arrow" d="M680 368 L560 368" />
  <rect class="box" x="210" y="328" width="320" height="76" />
  <text class="h" x="246" y="360">Git diff + review</text>
  <text class="t" x="246" y="384">Human stays in control</text>

  <!-- loop arrow back -->
  <path class="arrowMuted" d="M370 328 C370 282, 490 282, 490 270" />

  <!-- badge -->
  <circle class="badge" cx="1120" cy="150" r="14"/>
  <text class="badgeText" x="1115" y="154">1</text>
</svg>
