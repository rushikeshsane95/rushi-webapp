<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Diagram">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.12)"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" class="arrowHead"/>
    </marker>
  </defs>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primarySoft: #dbeafe;
      --success: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1220;
        --surface: #0f172a;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --primary: #60a5fa;
        --primarySoft: #0b2a55;
        --success: #22c55e;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--surface); stroke: var(--border); stroke-width: 1.25; rx: 16; filter: url(#shadow); }
    .box { fill: white; fill: var(--bg); stroke: var(--border); stroke-width: 1.25; rx: 14; }
    .chip { fill: var(--primarySoft); stroke: var(--border); stroke-width: 1; rx: 10; }
    .title { font: 700 22px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .h { font: 700 16px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--text); }
    .t { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: var(--muted); }
    .mono { font: 600 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; fill: var(--text); }
    .link { font: 600 13px ui-sans-serif, system-ui; fill: var(--primary); }
    .stroke { stroke: var(--border); stroke-width: 1.25; }
    .arrow { stroke: var(--primary); stroke-width: 2.25; fill: none; marker-end: url(#arrow); }
    .arrowMuted { stroke: var(--border); stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .arrowHead { fill: var(--primary); }
    .badge { fill: var(--primary); }
    .badgeText { font: 700 12px ui-sans-serif, system-ui; fill: white; }
  </style>

  <rect class="bg" x="0" y="0" width="1200" height="520"/>
  <text class="title" x="56" y="62">Team-scale agents.md architecture</text>
  <text class="t" x="56" y="88">Central standards + repo-specific overrides, enforced by CI</text>

  <rect class="panel" x="40" y="110" width="1120" height="370" />

  <!-- Standards repo -->
  <rect class="box" x="90" y="170" width="360" height="190" />
  <text class="h" x="124" y="206">engineering-ai-standards</text>

  <rect class="chip" x="124" y="224" width="200" height="26"/>
  <text class="mono" x="138" y="243">agents.base.md</text>

  <rect class="chip" x="124" y="256" width="220" height="26"/>
  <text class="mono" x="138" y="275">agents.blazor.md</text>

  <rect class="chip" x="124" y="288" width="240" height="26"/>
  <text class="mono" x="138" y="307">prompts/ (roles)</text>

  <text class="t" x="124" y="340">Single source of truth</text>

  <!-- Arrow to repos -->
  <path class="arrow" d="M450 265 L560 265" />
  <text class="t" x="482" y="250">sync / generate</text>

  <!-- Repos -->
  <rect class="box" x="580" y="160" width="180" height="110" />
  <text class="h" x="608" y="196">Repo A</text>
  <text class="mono" x="608" y="222">agents.md</text>
  <text class="t" x="608" y="246">Blazor site</text>

  <rect class="box" x="790" y="160" width="180" height="110" />
  <text class="h" x="818" y="196">Repo B</text>
  <text class="mono" x="818" y="222">agents.md</text>
  <text class="t" x="818" y="246">ASP.NET API</text>

  <rect class="box" x="1000" y="160" width="180" height="110" />
  <text class="h" x="1028" y="196">Repo C</text>
  <text class="mono" x="1028" y="222">agents.md</text>
  <text class="t" x="1028" y="246">Library</text>

  <!-- CI enforcement -->
  <path class="arrowMuted" d="M670 270 L670 332" />
  <path class="arrowMuted" d="M880 270 L880 332" />
  <path class="arrowMuted" d="M1090 270 L1090 332" />

  <rect class="box" x="720" y="340" width="420" height="90" />
  <text class="h" x="748" y="374">CI policy checks</text>
  <text class="t" x="748" y="398">Verify agents.md • Secret scan • Required workflow</text>

  <circle class="badge" cx="1120" cy="150" r="14"/>
  <text class="badgeText" x="1115" y="154">3</text>
</svg>
